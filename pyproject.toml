[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gc-mcp"
version = "0.2.0"
description = "Multi-machine Gas City (gc) & Generic CLI-to-MCP / REST Gateway with Google OAuth 2.1 and PKCE Device Flow"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=2.12.0",
]

[project.scripts]
gc-mcp = "gc_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
